name: site-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild runs scripts/verify.mjs — the page is verified before it exists
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright (smoke + axe accessibility)
        run: npx playwright test --project=desktop
      - name: Lighthouse CI (CLS / a11y / SEO budgets)
        run: npx lhci autorun
